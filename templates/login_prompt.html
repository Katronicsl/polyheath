{% extends "base.html" %}

{% block title %}Вход или регистрация{% endblock %}

{% block content %}
<style>
    * {
        box-sizing: border-box;
    }

    .auth-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        position: relative;
        overflow: hidden;

        background:
            radial-gradient(circle at top right, rgba(255,255,255,0.28) 0, transparent 30%),
            radial-gradient(circle at bottom left, rgba(255,255,255,0.20) 0, transparent 30%),
            linear-gradient(180deg, #0f4db8 0%, #a8c1eb 100%);
    }

    .auth-page::before,
    .auth-page::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: rgba(255,255,255,0.12);
        filter: blur(10px);
        animation: floatBlob 8s ease-in-out infinite;
    }

    .auth-page::before {
        width: 320px;
        height: 320px;
        top: -80px;
        right: -60px;
    }

    .auth-page::after {
        width: 240px;
        height: 240px;
        bottom: -70px;
        left: -40px;
        animation-delay: 2s;
    }

    .auth-card {
        width: 100%;
        max-width: 420px;
        padding: 34px 28px 28px;
        border-radius: 26px;

        background: rgba(255,255,255,0.16);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);

        border: 1px solid rgba(255,255,255,0.28);
        box-shadow: 0 18px 45px rgba(7,39,102,0.22);

        text-align: center;
        position: relative;
        z-index: 2;
        animation: cardAppear 0.7s ease;
    }

    .auth-logo {
        user-select: none;
        width: 90px;
        margin-bottom: 14px;
        animation: floatLogo 4s ease-in-out infinite;
    }

    .auth-title {
        font-size: 28px;
        color: #fff;
        margin-bottom: 20px;
        font-weight: 600;
    }

    .auth-buttons {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .auth-btn {
        display: block;
        padding: 14px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;

        background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(220,233,255,0.95));
        color: #0f4db8;

        box-shadow: 0 10px 22px rgba(7,39,102,0.18);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .auth-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px rgba(7,39,102,0.22);
    }

    .auth-btn.secondary {
        background: rgba(255,255,255,0.18);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.3);
    }

    .home-link {
        margin-top: 18px;
        display: inline-block;
        color: rgba(255,255,255,0.9);
        font-size: 14px;
    }

    .home-link:hover {
        text-decoration: underline;
    }

.back-link {
    margin-top: 18px;
    display: inline-block;
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    position: relative;
    text-decoration: none;
    font-weight: 700;
}

/* линия снизу */
.back-link::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -2px;
    width: 0;
    height: 2px;
    background: white;
    transition: width 0.25s ease;
}

.back-link:hover::after {
    width: 100%;
}

    @keyframes floatLogo {
        0% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0); }
    }

    @keyframes floatBlob {
        0% { transform: translateY(0) translateX(0); }
        50% { transform: translateY(12px) translateX(-10px); }
        100% { transform: translateY(0) translateX(0); }
    }

    @keyframes cardAppear {
        from {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }
</style>

<div class="auth-page">
    <div class="auth-card">

        <img
            class="auth-logo"
            src="{{ url_for('static', filename='images/логотип.png') }}"
            alt="логотип"
        >

        <h1 class="auth-title">
            Для продолжения войдите в аккаунт
        </h1>

        <div class="auth-buttons">

            <a
                href="{{ url_for('auth.login') }}?next={{ next }}"
                class="auth-btn"
            >
                Войти
            </a>

            <a
                href="{{ url_for('auth.register') }}?next={{ next }}"
                class="auth-btn secondary"
            >
                Зарегистрироваться
            </a>

        </div>

            <a
                href="{{ url_for('navigatortests') }}"
                class="back-link"
            >
                ← Назад
            </a>

    </div>
</div>

{% endblock %}

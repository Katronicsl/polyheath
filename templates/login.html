{% extends "base.html" %}

{% block title %}Вход - PolyHealth{% endblock %}

{% block content %}
<style>
    * {
        box-sizing: border-box;
    }

    .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background:
            radial-gradient(circle at top right, rgba(255,255,255,0.28) 0, rgba(255,255,255,0) 28%),
            radial-gradient(circle at bottom left, rgba(255,255,255,0.20) 0, rgba(255,255,255,0) 30%),
            linear-gradient(180deg, #0f4db8 0%, #a8c1eb 100%);
        overflow: hidden;
        position: relative;
    }

    .login-page::before,
    .login-page::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        filter: blur(10px);
        animation: floatBlob 8s ease-in-out infinite;
    }

    .login-page::before {
        width: 320px;
        height: 320px;
        top: -80px;
        right: -60px;
    }

    .login-page::after {
        width: 240px;
        height: 240px;
        bottom: -70px;
        left: -40px;
        animation-delay: 2s;
    }

    .login-card {
        width: 100%;
        max-width: 430px;
        padding: 34px 30px 28px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.28);
        box-shadow: 0 18px 45px rgba(7, 39, 102, 0.22);
        position: relative;
        z-index: 2;
        animation: cardAppear 0.8s ease;
    }

    .login-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 28px;
        padding: 1px;
        background: linear-gradient(135deg, rgba(255,255,255,0.45), rgba(255,255,255,0.08));
        -webkit-mask:
            linear-gradient(#fff 0 0) content-box,
            linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
    }

    .logo-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 14px;
    }

    .login-logo {
        width: 110px;
        height: auto;
        object-fit: contain;
        background: none;
        border-radius: 0;
        box-shadow: none;
        animation: logoFloat 4s ease-in-out infinite;
    }

    .login-title {
        margin: 0 0 8px 0;
        text-align: center;
        font-size: 40px;
        color: #ffffff;
        font-family: Georgia, serif;
        text-shadow: 0 3px 10px rgba(7, 39, 102, 0.22);
    }

    .login-subtitle {
        margin: 0 0 24px 0;
        text-align: center;
        color: rgba(255,255,255,0.92);
        font-size: 15px;
    }

    .error-text {
        margin: 0 0 14px 0;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(255, 77, 77, 0.16);
        border: 1px solid rgba(255, 120, 120, 0.28);
        color: #fff;
        font-size: 14px;
    }

    .login-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .field-group label {
        display: block;
        margin-bottom: 7px;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
    }

    .field-group input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.26);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
        font-size: 15px;
        outline: none;
        transition: 0.25s ease;
    }

    .field-group input::placeholder {
        color: rgba(255,255,255,0.72);
    }

    .field-group input:focus {
        border-color: rgba(255,255,255,0.55);
        background: rgba(255, 255, 255, 0.23);
        box-shadow: 0 0 0 4px rgba(255,255,255,0.10);
        transform: translateY(-1px);
    }

    .login-btn {
        margin-top: 6px;
        width: 100%;
        padding: 14px 18px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(220,233,255,0.95) 100%);
        color: #0f4db8;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(7, 39, 102, 0.18);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 30px rgba(7, 39, 102, 0.22);
    }

    .login-btn:active {
        transform: translateY(0);
    }

    .register-link {
        margin-top: 18px;
        text-align: center;
        color: rgba(255,255,255,0.92);
        font-size: 15px;
    }

    .register-link a {
        color: #ffffff;
        font-weight: 700;
        position: relative;
    }

    .register-link a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -2px;
        width: 100%;
        height: 2px;
        background: rgba(255,255,255,0.92);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.25s ease;
    }

    .register-link a:hover::after {
        transform: scaleX(1);
    }

    @keyframes logoFloat {
        0% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0); }
    }

    @keyframes floatBlob {
        0% { transform: translateY(0) translateX(0); }
        50% { transform: translateY(12px) translateX(-10px); }
        100% { transform: translateY(0) translateX(0); }
    }

    @keyframes cardAppear {
        from {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @media (max-width: 520px) {
        .login-card {
            padding: 28px 20px 24px;
            border-radius: 22px;
        }

        .login-title {
            font-size: 34px;
        }

        .login-logo {
            width: 74px;
            height: 74px;
        }
    }
</style>

<div class="login-page">
    <div class="login-card">
        <div class="logo-wrap">
            <img
                class="login-logo"
                src="{{ url_for('static', filename='images/логотип.png') }}"
                alt="Логотип PolyHealth"
            >
        </div>

        <h1 class="login-title">Вход</h1>
        <p class="login-subtitle">Для продолжения войдите в свой аккаунт.</p>

        {% if error %}
            <p class="error-text">{{ error }}</p>
        {% endif %}

        <form method="POST" class="login-form">
            <div class="field-group">
                <label>Имя пользователя:</label>
                <input type="text" name="username" placeholder="Введите имя пользователя" required>
            </div>

            <div class="field-group">
                <label>Пароль:</label>
                <input type="password" name="password" placeholder="Введите пароль" required>
            </div>

            <button type="submit" class="login-btn">Войти</button>
        </form>

        <div class="register-link">
            <a href="{{ url_for('auth.register') }}">Регистрация</a>
        </div>
    </div>
</div>
{% endblock %}
